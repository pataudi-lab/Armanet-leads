version: "3.9"
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: armanet
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  web:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/armanet
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@db:5432/armanet
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: changeme
    ports:
      - "3000:3000"
    command: ["npm","run","start"]
  worker:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/armanet
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@db:5432/armanet
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: changeme
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: changeme
    command: ["npm","run","worker"]
volumes:
  db-data:
